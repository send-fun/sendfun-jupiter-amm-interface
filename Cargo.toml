[package]
name = "sendfun-jupiter"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Jupiter AMM routing for the send.fun launchpad and DEX"
license = "MIT"
keywords = ["solana", "jupiter", "amm", "send-fun"]
# Git-only interface and test kit: nothing here can go to crates.io.
publish = false

[lib]
crate-type = ["lib"]

[dependencies]
jupiter-amm-interface = { git = "https://github.com/jup-ag/jupiter-amm-interface", rev = "95bd1848" }
rust_decimal = "1.36"
sendfun-sdk = { version = "3.0.0", default-features = false }
# The interface's majors: `ReadableAccount`, `AccountMeta` and `Pubkey` cross
# its API, and it re-exports none of them.
solana-account = "4"
solana-instruction = "3"
solana-pubkey = "4"

[dev-dependencies]
bincode = "1.3"
borsh = "1"
jupiter-amm-test-kit = { git = "https://github.com/jup-ag/jupiter-amm-interface", rev = "95bd1848" }
# The kit's own generation, for the exact-out harness it doesn't cover yet.
litesvm = "0.14.0"
# `KeyedAccount.params`' type, which the interface doesn't re-export.
serde_json = "1"
solana-clock = "3"
solana-compute-budget-interface = "3"
solana-keypair = "3"
solana-signer = "3"
solana-transaction = "4"
# Builds hook-list fixtures.
spl-discriminator = "0.5.1"
spl-tlv-account-resolution = "0.11.4"

# Its own workspace, so its own lockfile. The test kit's LiteSVM 0.14 needs
# wincode 0.5, which holds solana-clock, solana-last-restart-slot and
# solana-slot-history below 3.2 (see the kit's README). Cargo.lock started from
# the kit's own, and the tests need it: a bare `cargo update` moves those three
# and LiteSVM stops compiling. If that happens, restore the committed
# Cargo.lock. The library builds either way.
[workspace]

[lints.rust]
missing_docs = "allow"
unused_crate_dependencies = "warn"
unfulfilled_lint_expectations = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cognitive_complexity = "allow"
cargo_common_metadata = "allow"
missing_errors_doc = "allow"
too_many_lines = "allow"
await_holding_lock = "deny"
multiple_crate_versions = "allow"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
negative_feature_names = "allow"
mod_module_files = "warn"
undocumented_unsafe_blocks = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
dbg_macro = "deny"
wildcard_imports = "allow"
indexing_slicing = "warn"
clone_on_ref_ptr = "warn"
needless_pass_by_value = "allow"
unnecessary_wraps = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
mem_forget = "deny"
arithmetic_side_effects = "warn"
